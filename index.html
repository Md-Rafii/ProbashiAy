<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রেটবন্ধু – কারেন্সি রেট ও হিসাব</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7690;--pr:#0f9d6e;--rd:#e0483e;--bd:#e3e8f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mu:#8e9ab5;--bd:#27314a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pr);color:#fff;padding:14px 16px;font-weight:700;font-size:20px;display:flex;justify-content:space-between;align-items:center}
header small{font-weight:400;font-size:12px;opacity:.9}
nav{display:flex;position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font:600 14px inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--pr);border-color:var(--pr)}
main{max-width:760px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,button.b{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button.b{background:var(--pr);color:#fff;border:0;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.list>div{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px}
.list>div:last-child{border:0}.mu{color:var(--mu);font-size:12px}
.in{color:var(--pr)}.ex{color:var(--rd)}.big{font-size:24px;font-weight:700}
.star{cursor:pointer;font-size:20px;background:none;border:0;color:#f0b429}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hide{display:none}.x{background:none;border:0;color:var(--rd);font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header><span>🌍 রেটবন্ধু</span><small id="upd">লোড হচ্ছে…</small></header>
<nav id="nav">
<button class="on" data-t="rates">রেট</button><button data-t="conv">কনভার্টার</button><button data-t="tx">হিসাব</button>
</nav>
<main>
<section id="rates">
<div class="card">
<div class="row"><select id="base"></select><input id="q" placeholder="🔍 খুঁজুন (USD, ডলার…)"></div>
<div class="mu" id="baseNote"></div>
</div>
<div class="card list" id="rateList"></div>
</section>

<section id="conv" class="hide">
<div class="card">
<input id="cAmt" type="number" value="1" inputmode="decimal">
<div class="row"><select id="cFrom"></select><select id="cTo"></select></div>
<button class="b" id="swap">⇄ অদলবদল</button>
<div class="big" id="cOut">—</div><div class="mu" id="cRate"></div>
</div>
</section>

<section id="tx" class="hide">
<div class="card"><div class="sum">
<div><div class="mu">আয়</div><div class="in big" id="sIn">0</div></div>
<div><div class="mu">ব্যয়</div><div class="ex big" id="sEx">0</div></div>
<div><div class="mu">ব্যালেন্স</div><div class="big" id="sBal">0</div></div>
</div><div class="mu" style="text-align:center;margin-top:6px">সব হিসাব <b id="hc"></b> এ দেখানো হচ্ছে</div></div>
<div class="card">
<div class="row"><select id="tType"><option value="in">আয়</option><option value="ex">ব্যয়</option></select>
<select id="tCat"></select></div>
<div class="row"><input id="tAmt" type="number" placeholder="পরিমাণ" inputmode="decimal"><select id="tCur"></select></div>
<div class="row"><input id="tDate" type="date"><input id="tNote" placeholder="নোট"></div>
<button class="b" id="tAdd">+ যোগ করুন</button>
</div>
<div class="card"><div class="row"><select id="fMonth"></select><select id="fHome"></select></div>
<button class="b" id="csv" style="background:#3b5bdb">CSV ডাউনলোড</button></div>
<div class="card list" id="txList"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let rates=store.get('rb_rates',null),fav=store.get('rb_fav',['USD','EUR','GBP','SAR','AED','INR']),txs=store.get('rb_tx',[]),home=store.get('rb_home','BDT');
const cats={in:['বেতন','ব্যবসা','রেমিটেন্স','উপহার','অন্যান্য'],ex:['খাবার','বাসা ভাড়া','যাতায়াত','বিল','কেনাকাটা','চিকিৎসা','অন্যান্য']};
const dn=new Intl.DisplayNames(['bn'],{type:'currency'}),dnEn=new Intl.DisplayNames(['en'],{type:'currency'});
const nm=c=>{try{return dn.of(c)}catch(e){return c}},nmE=c=>{try{return dnEn.of(c)}catch(e){return ''}};
const fmt=(n,d=2)=>Number(n).toLocaleString('bn-BD',{maximumFractionDigits:n<1?6:d});
const list=()=>rates?Object.keys(rates.rates).sort():[];
const rate=(from,to)=>rates.rates[to]/rates.rates[from];

async function load(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();
    if(j.result==='success'){rates={rates:j.rates,time:j.time_last_update_utc};store.set('rb_rates',rates);}
  }catch(e){}
  if(!rates){$('upd').textContent='ডাটা পাওয়া যায়নি';return}
  $('upd').textContent='আপডেট: '+new Date(rates.time).toLocaleString('bn-BD');
  init();
}
function opts(sel,val){const l=list();sel.innerHTML=l.map(c=>`<option value="${c}">${c} – ${nm(c)}</option>`).join('');sel.value=val}
function init(){
  opts($('base'),store.get('rb_base','USD'));opts($('cFrom'),'USD');opts($('cTo'),'BDT');opts($('tCur'),home);opts($('fHome'),home);
  setCats();$('tDate').valueAsDate=new Date();
  drawRates();conv();drawTx();
}
function drawRates(){
  const b=$('base').value,q=$('q').value.trim().toLowerCase();store.set('rb_base',b);
  $('baseNote').textContent=`১ ${b} (${nm(b)}) = বাকি মুদ্রার সমান`;
  let l=list().filter(c=>c!==b&&(!q||c.toLowerCase().includes(q)||nm(c).toLowerCase().includes(q)||nmE(c).toLowerCase().includes(q)));
  l.sort((a,c)=>(fav.includes(c)-fav.includes(a))||a.localeCompare(c));
  $('rateList').innerHTML=l.map(c=>`<div><div><b>${c}</b> <span class="mu">${nm(c)}</span></div><div style="display:flex;align-items:center;gap:8px"><b>${fmt(rate(b,c),4)}</b><button class="star" data-c="${c}">${fav.includes(c)?'★':'☆'}</button></div></div>`).join('')||'<div class="mu">কিছু পাওয়া যায়নি</div>';
}
function conv(){
  const a=parseFloat($('cAmt').value)||0,f=$('cFrom').value,t=$('cTo').value;
  $('cOut').textContent=`${fmt(a*rate(f,t))} ${t}`;$('cRate').textContent=`১ ${f} = ${fmt(rate(f,t),4)} ${t}`;
}
function setCats(){$('tCat').innerHTML=cats[$('tType').value].map(c=>`<option>${c}</option>`).join('')}
function drawTx(){
  const months=[...new Set(txs.map(t=>t.d.slice(0,7)))].sort().reverse();const cur=$('fMonth').value||'all';
  $('fMonth').innerHTML='<option value="all">সব সময়</option>'+months.map(m=>`<option>${m}</option>`).join('');$('fMonth').value=months.includes(cur)?cur:'all';
  $('hc').textContent=home;
  const l=txs.filter(t=>$('fMonth').value==='all'||t.d.startsWith($('fMonth').value)).sort((a,b)=>b.d.localeCompare(a.d));
  let i=0,e=0;
  l.forEach(t=>{const v=t.a*rate(t.c,home);t.k==='in'?i+=v:e+=v});
  $('sIn').textContent=fmt(i,0);$('sEx').textContent=fmt(e,0);$('sBal').textContent=fmt(i-e,0);
  $('txList').innerHTML=l.map(t=>`<div><div><b>${t.cat}</b><div class="mu">${t.d} ${t.n?'· '+t.n.replace(/</g,'&lt;'):''}</div></div><div style="display:flex;gap:6px;align-items:center"><b class="${t.k}">${t.k==='in'?'+':'−'}${fmt(t.a)} ${t.c}</b><button class="x" data-id="${t.id}">✕</button></div></div>`).join('')||'<div class="mu">এখনো কোনো হিসাব নেই</div>';
}
document.addEventListener('click',e=>{
  const s=e.target.closest('.star');if(s){const c=s.dataset.c;fav=fav.includes(c)?fav.filter(x=>x!==c):[...fav,c];store.set('rb_fav',fav);drawRates()}
  const x=e.target.closest('.x');if(x&&confirm('মুছে ফেলবেন?')){txs=txs.filter(t=>t.id!=x.dataset.id);store.set('rb_tx',txs);drawTx()}
});
$('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===e.target));['rates','conv','tx'].forEach(s=>$(s).classList.toggle('hide',s!==t))};
$('base').onchange=$('q').oninput=drawRates;
['cAmt','cFrom','cTo'].forEach(i=>$(i).oninput=conv);
$('swap').onclick=()=>{const f=$('cFrom').value;$('cFrom').value=$('cTo').value;$('cTo').value=f;conv()};
$('tType').onchange=setCats;$('fMonth').onchange=drawTx;
$('fHome').onchange=()=>{home=$('fHome').value;store.set('rb_home',home);drawTx()};
$('tAdd').onclick=()=>{
  const a=parseFloat($('tAmt').value);if(!(a>0))return alert('সঠিক পরিমাণ দিন');
  txs.push({id:Date.now(),k:$('tType').value,cat:$('tCat').value,a,c:$('tCur').value,d:$('tDate').value||new Date().toISOString().slice(0,10),n:$('tNote').value});
  store.set('rb_tx',txs);$('tAmt').value='';$('tNote').value='';drawTx();
};
$('csv').onclick=()=>{
  const rows=[['তারিখ','ধরন','ক্যাটাগরি','পরিমাণ','মুদ্রা','নোট'],...txs.map(t=>[t.d,t.k==='in'?'আয়':'ব্যয়',t.cat,t.a,t.c,'"'+(t.n||'').replace(/"/g,'""')+'"'])];
  const u=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));
  const a=document.createElement('a');a.href=u;a.download='hisab.csv';a.click();
};
load();
</script>
</body>
</html>
