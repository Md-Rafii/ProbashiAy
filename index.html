<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>সঞ্চয় — Personal Finance Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6B5C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#F0EEE7;
  --ink:#16231F; --ink-soft:#5B6B62; --border:#E4E0D6;
  --primary:#0F6B5C; --primary-ink:#0B4A40; --primary-tint:#E5F2EE;
  --gold:#C99A3E; --gold-tint:#FBF3E1;
  --rust:#B9502F; --rust-tint:#FBEAE3;
  --shadow: 0 1px 2px rgba(22,35,31,.06), 0 8px 24px rgba(22,35,31,.06);
  --radius: 16px;
  --font-display:'Fraunces', 'Noto Sans Bengali', serif;
  --font-body:'Inter','Noto Sans Bengali',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0F1613; --surface:#16211D; --surface-2:#1C2822;
  --ink:#EAEFEA; --ink-soft:#93A399; --border:#28352F;
  --primary:#3FBFA0; --primary-ink:#8FE3CC; --primary-tint:#182C27;
  --gold:#E0B65C; --gold-tint:#2B2313;
  --rust:#E17B57; --rust-tint:#2E1B14;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html,body{overflow-x:hidden; max-width:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; min-height:100vh;
  word-wrap:break-word; overflow-wrap:anywhere;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
a{color:inherit;}
button{font-family:inherit;}
img,canvas,svg{max-width:100%;}
::selection{background:var(--gold-tint); color:var(--ink);}

/* ---------- Layout shell ---------- */
#app{min-height:100vh; max-width:100%;}
.shell{display:flex; min-height:100vh; max-width:100%;}
.sidebar{
  width:250px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  padding:24px 16px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--primary),var(--primary-ink));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:18px;flex-shrink:0;}
.brand-name{font-family:var(--font-display); font-weight:600; font-size:19px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer;
  color:var(--ink-soft); font-size:14.5px; font-weight:500; transition:.15s;
}
.nav-item i{width:18px; text-align:center; font-size:15px;}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--primary-tint); color:var(--primary-ink); font-weight:600;}
.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:4px;}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
  border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:20;
}
.topbar h2{margin:0; font-size:21px;}
.content{padding:24px 28px 100px; max-width:1200px; width:100%; margin:0 auto; min-width:0;}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);}
.topbar-actions{display:flex; gap:8px; align-items:center;}

/* Mobile bottom nav */
.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
  z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottom-nav-inner{display:flex; justify-content:space-around;}
.bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-soft); font-size:10.5px; padding:6px 4px; border-radius:10px; cursor:pointer; flex:1; min-width:0; text-align:center;}
.bn-item span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bn-item i{font-size:16px;}
.bn-item.active{color:var(--primary-ink); font-weight:600;}

@media (max-width:900px){
  .sidebar{display:none;}
  .content{padding:16px 14px 96px;}
  .topbar{padding:14px 16px;}
  .bottom-nav{display:block;}
}

/* ---------- Components ---------- */
/* minmax(0,1fr) সবচেয়ে গুরুত্বপূর্ণ: এটা কার্ডকে কনটেন্টের কারণে স্ক্রিনের বাইরে যেতে দেয় না */
.grid{display:grid; gap:14px;}
.grid > *{min-width:0;}
.cards-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.cards-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:1000px){.cards-4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:900px){.cards-2{grid-template-columns:minmax(0,1fr);}}
@media(max-width:380px){.cards-4{grid-template-columns:minmax(0,1fr);}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); min-width:0;}
.stat-card{position:relative; overflow:hidden;}
.stat-card .stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px;}
.stat-card .stat-label{font-size:12.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.stat-card .stat-value{font-family:var(--font-mono); font-size:21px; font-weight:600; margin-top:4px; word-break:break-word;}
.stat-card .stat-sub{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

.section-title{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:26px 0 12px;}
.section-title h3{margin:0; font-size:16.5px;}

.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; border:1px solid transparent;
  font-weight:600; font-size:14px; cursor:pointer; transition:.15s;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-ink);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--rust-tint); color:var(--rust);}
.btn-danger:hover{filter:brightness(.95);}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:8px;}
.btn-block{width:100%; justify-content:center;}
.fab{
  position:fixed; right:22px; bottom:88px; width:52px; height:52px; border-radius:50%; background:var(--primary);
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 8px 20px rgba(15,107,92,.35);
  border:none; cursor:pointer; z-index:25;
}
@media(min-width:901px){.fab{bottom:28px;}}

.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; padding:12px 14px; color:var(--ink-soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:12px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-2);}
.row-actions{display:flex; gap:6px; flex-shrink:0;}

.pill{display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
.pill-income{background:var(--primary-tint); color:var(--primary-ink);}
.pill-expense{background:var(--rust-tint); color:var(--rust);}
.pill-family{background:var(--gold-tint); color:#8A6417;}
[data-theme="dark"] .pill-family{color:var(--gold);}

.empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty i{font-size:30px; margin-bottom:10px; opacity:.5;}

.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
.form-grid > *{min-width:0;}
@media(max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr);}}
.field{display:flex; flex-direction:column; gap:6px; min-width:0;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
input,select,textarea{
  padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--ink);
  font-size:14px; font-family:inherit; outline:none; max-width:100%; min-width:0;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
textarea{resize:vertical; min-height:60px;}
.error-text{color:var(--rust); font-size:12px;}
.toggle{display:flex; align-items:center; gap:10px;}
.switch{position:relative; width:42px; height:24px; background:var(--border); border-radius:20px; cursor:pointer; flex-shrink:0;}
.switch.on{background:var(--primary);}
.switch::after{content:'';position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.15s;}
.switch.on::after{left:20px;}

.progress-track{height:10px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--primary)); border-radius:20px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(15,20,18,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal{background:var(--surface); border-radius:18px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
.modal-header h3{margin:0; min-width:0; overflow-wrap:anywhere;}

.toast-wrap{position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 24px);}
.toast{background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; animation:slidein .2s ease;}
.toast.err{background:var(--rust);}
.toast.ok{background:var(--primary-ink);}
@keyframes slidein{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

.filters{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.filters select, .filters input{min-width:130px;}

.insight{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; background:var(--gold-tint); margin-bottom:8px; font-size:13.5px;}
.insight i{color:var(--gold); margin-top:2px;}

.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(circle at 20% 20%, var(--primary-tint), var(--bg) 60%);}
.auth-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px 28px; box-shadow:var(--shadow);}
.auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; text-align:center;}
.auth-tabs{display:flex; background:var(--surface-2); border-radius:12px; padding:4px; margin-bottom:20px;}
.auth-tab{flex:1; text-align:center; padding:8px; border-radius:9px; cursor:pointer; font-weight:600; font-size:13.5px; color:var(--ink-soft);}
.auth-tab.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
.loading-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-loader{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--ink-soft); flex-direction:column; gap:10px;}

.chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); min-width:0; overflow:hidden;}
.chart-card canvas{max-height:260px; max-width:100%;}
.charts-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
.charts-grid > *{min-width:0;}
@media(max-width:900px){.charts-grid{grid-template-columns:minmax(0,1fr);}}
.chart-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:200px; color:var(--ink-soft); text-align:center;}
.chart-empty i{font-size:26px; opacity:.45;}
.chart-empty span{font-size:12.5px;}

.goal-card{display:flex; flex-direction:column; gap:10px;}
.small-muted{font-size:12px; color:var(--ink-soft);}

/* Profile */
.avatar{border-radius:50%; object-fit:cover; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; flex-shrink:0; overflow:hidden;}
.avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.profile-header{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.avatar-upload{position:relative; cursor:pointer;}
.avatar-upload .avatar-edit-badge{position:absolute; bottom:-2px; right:-2px; width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; border:2px solid var(--surface);}
.sidebar-user{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; margin-bottom:6px; cursor:pointer;}
.sidebar-user:hover{background:var(--surface-2);}
.sidebar-user .su-name{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sidebar-user .su-sub{font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* Debts / loan ledger */
.debt-card{display:flex; flex-direction:column; gap:10px;}
.debt-card .debt-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.debt-card .debt-head > div:first-child{min-width:0;}
.debt-amounts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:4px;}
.debt-amounts .da{background:var(--surface-2); border-radius:10px; padding:8px 10px; min-width:0;}
.debt-amounts .da-label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
.debt-amounts .da-value{font-family:var(--font-mono); font-size:14.5px; font-weight:600; margin-top:2px; word-break:break-word;}
.debt-actions{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
.payment-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
.payment-row:last-child{border-bottom:none;}
.pill-paid{background:var(--primary-tint); color:var(--primary-ink);}
.pill-remaining{background:var(--rust-tint); color:var(--rust);}

/* ===================== MOBILE FRIENDLY (সব পেজ) ===================== */
@media (max-width:600px){
  .content{padding:14px 12px 96px;}
  .topbar{padding:12px 14px;}
  .topbar h2{font-size:18px;}
  .topbar-actions{gap:6px;}
  .icon-btn{width:36px; height:36px;}
  .card{padding:14px;}
  .chart-card{padding:14px;}
  .section-title{margin:20px 0 10px;}

  /* স্ট্যাট কার্ড */
  .stat-card .stat-value{font-size:17px;}
  .stat-card .stat-label{font-size:11px;}
  .stat-card .stat-icon{width:32px; height:32px; font-size:14px; margin-bottom:8px;}

  /* ঋণ কার্ড: ৩টা বক্স নিচে নিচে, বাটন wrap */
  .debt-amounts{grid-template-columns:minmax(0,1fr);}
  .debt-amounts .da{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .debt-amounts .da-value{margin-top:0; font-size:15px;}
  .debt-actions .btn{flex:1 1 140px; justify-content:center;}
  .debt-card .debt-head{flex-wrap:wrap;}

  /* ফিল্টার */
  .filters select,.filters input{min-width:0; flex:1 1 45%;}

  /* টেবিল: শুধু টেবিলের ভেতরে স্ক্রল হবে */
  th,td{padding:10px; font-size:12.5px;}

  /* মডাল নিচ থেকে উঠবে */
  .modal-backdrop{padding:8px; align-items:flex-end;}
  .modal{max-height:92vh; border-radius:18px 18px 12px 12px; padding:16px;}

  /* টোস্ট */
  .toast-wrap{left:12px; right:12px; top:12px; max-width:none;}

  /* লগইন */
  .auth-wrap{padding:14px;}
  .auth-card{padding:24px 18px;}

  .profile-header{gap:12px;}
  .fab{right:14px; bottom:84px;}
}
/* iOS-এ ফোকাসে অটো-জুম বন্ধ */
@media (max-width:900px){
  input,select,textarea{font-size:16px;}
}
</style>
</head>

/* ============ CHART.JS LOADER ============
   Loaded dynamically (instead of a trailing <script> tag) so we can *know* when it's ready
   and guarantee it is available before any canvas is drawn — a static tag at the bottom of
   the page raced with the dashboard render on slow/blocked connections and left charts blank.
   FIX: tries multiple CDNs in sequence (cdnjs -> jsdelivr -> unpkg) so a single blocked
   domain doesn't take down the whole charts section, and supports a forced retry. */
function loadChartJs(force){
  if(window.Chart && !force) return Promise.resolve(true);
  if(window.__chartJsPromise && !force) return window.__chartJsPromise;
  const sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js'
  ];
  function tryLoad(i){
    return new Promise((resolve)=>{
      if(i>=sources.length){ resolve(false); return; }
      const s = document.createElement('script');
      s.src = sources[i];
      s.onload = ()=> resolve(true);
      s.onerror = ()=>{ s.remove(); tryLoad(i+1).then(resolve); };
      document.head.appendChild(s);
    });
  }
  window.__chartJsPromise = tryLoad(0);
  return window.__chartJsPromise;
}
loadChartJs(); // kick off as early as possible so it's ready (or cached) by the time the dashboard renders

/* ============ TOAST ============ */
function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err'?' err':kind==='ok'?' ok':'');
  el.innerHTML = `<i class="fa-solid ${kind==='err'?'fa-circle-exclamation':kind==='ok'?'fa-circle-check':'fa-info-circle'}"></i><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 3200);
}
function showUndoToast(msg, onUndo){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i class="fa-solid fa-trash"></i><span>${msg}</span><button style="margin-left:6px; background:none; border:1px solid rgba(255,255,255,.4); color:inherit; border-radius:6px; padding:3px 9px; cursor:pointer; font-weight:600; font-size:12px;">${t('undo')}</button>`;
  wrap.appendChild(el);
  const timer = setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 6000);
  el.querySelector('button').addEventListener('click', ()=>{ clearTimeout(timer); el.remove(); if(onUndo) onUndo(); });
}
function friendlyError(e){
  const code = (e && e.code) || '';
  if(!navigator.onLine) return t('networkError');
  if(code.includes('auth/invalid-credential') || code.includes('auth/wrong-password') || code.includes('auth/user-not-found')) return S.lang==='bn'?'ইমেইল বা পাসওয়ার্ড সঠিক নয়।':'Incorrect email or password.';
  if(code.includes('auth/email-already-in-use')) return S.lang==='bn'?'এই ইমেইল দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে।':'An account already exists with this email.';
  if(code.includes('auth/weak-password')) return S.lang==='bn'?'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।':'Password should be at least 6 characters.';
  if(code.includes('auth/invalid-email')) return S.lang==='bn'?'সঠিক ইমেইল দিন।':'Enter a valid email.';
  if(code.includes('auth/popup-closed-by-user')) return S.lang==='bn'?'Google সাইন-ইন উইন্ডো বন্ধ করে দেওয়া হয়েছিল। আবার চেষ্টা করুন।':'The Google sign-in window was closed. Please try again.';
  if(code.includes('auth/account-exists-with-different-credential')) return S.lang==='bn'?'এই ইমেইল দিয়ে অন্য পদ্ধতিতে (যেমন পাসওয়ার্ড দিয়ে) ইতিমধ্যে অ্যাকাউন্ট আছে। সেই পদ্ধতিতে লগইন করুন।':'An account already exists with this email using a different sign-in method.';
  if(code.includes('permission-denied')) return S.lang==='bn'?'অনুমতি নেই — Firestore Security Rules চেক করুন (Firebase Console)।':'Permission denied — check your Firestore Security Rules in the Firebase Console.';
  if(code.includes('unavailable')) return S.lang==='bn'?'সার্ভারে সংযোগ করা যাচ্ছে না। ইন্টারনেট চেক করুন।':'Could not reach the server. Check your internet connection.';
  if(code.includes('not-found') && code.includes('firestore')) return S.lang==='bn'?'Firestore ডেটাবেস খুঁজে পাওয়া যায়নি — Firebase Console-এ Firestore Database তৈরি করা হয়েছে কিনা দেখুন।':'Firestore database not found — check that you created a Firestore Database in the Firebase Console.';
  if(e && e.message) console.error('Shonchoy error:', code, e.message);
  return t('genericError');
}

function userCol(name){ return collection(db, 'users', S.user.uid, name); }

// আগের কোডে এই ফাংশনটি কল হচ্ছিল কিন্তু ডিফাইন করা ছিল না (কনসোলে error আসত)। ভবিষ্যতের অটোমেশনের জন্য খালি রাখা হলো।
function maybeRunAutomations(){}

function subscribeAll(){
  Object.values(MODULES).forEach(mod=>{
    const unsub = onSnapshot(query(userCol(mod.col)), snap=>{
      const active = [], deleted = [];
      snap.forEach(d=>{ const item = { id:d.id, ...d.data() }; (item.isDeleted? deleted : active).push(item); });
      active.sort((a,b)=> (b.date||b.createdAtStr||'').localeCompare(a.date||a.createdAtStr||''));
      deleted.sort((a,b)=> (b.date||b.createdAtStr||'').localeCompare(a.date||a.createdAtStr||''));
      S.data[mod.col] = active;
      S.trash[mod.col] = deleted;
      S.loaded[mod.col] = true;
      if(document.body.contains(document.getElementById('app'))) render();
      maybeRunAutomations();
    }, err=>{
      toast(friendlyError(err),'err');
    });
    S.unsubs.push(unsub);
  });
  const pUnsub = onSnapshot(userDoc('settings','profile'), snap=>{
    if(snap.exists()){
      const d = snap.data();
      S.profile.currencies = d.currencies || DEFAULT_CURRENCIES.slice();
      S.profile.exchangeRates = d.exchangeRates || {BDT:1};
      S.profile.defaultCurrency = d.defaultCurrency || 'BDT';
      S.profile.budgets = d.budgets || {};
      S.profile.ratesUpdatedAt = d.ratesUpdatedAt || null;
      S.profile.name = d.name || '';
      S.profile.phone = d.phone || '';
      S.profile.photoURL = d.photoURL || '';
      S.profile.bio = d.bio || '';
      S.profile.location = d.location || '';
      S.profile.occupation = d.occupation || '';
      if(d.language && d.language!==S.lang){ S.lang=d.language; document.documentElement.lang=S.lang; }
      if(d.theme && d.theme!==S.theme){ S.theme=d.theme; document.documentElement.setAttribute('data-theme',S.theme); }
    } else {
      setDoc(userDoc('settings','profile'), { currencies:DEFAULT_CURRENCIES, exchangeRates:{BDT:1}, defaultCurrency:'BDT', budgets:{}, language:S.lang, theme:S.theme,
        name:'', phone:'', photoURL:'', bio:'', location:'', occupation:'', createdAt:serverTimestamp() });
    }
    S.loaded.profile = true;
    render();
    maybeRunAutomations();
  });
  S.unsubs.push(pUnsub);
}
function unsubscribeAll(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; S.loaded={}; }

onAuthStateChanged(auth, (user)=>{

});

// Keeps a lightweight top-level users/{uid} record (email, name, provider, timestamps) so an
// admin account can list every registered user without needing access to their private data.
async function upsertUserDirectoryEntry(user){
  try{
    const ref = doc(db, 'users', user.uid);
    const snap = await getDoc(ref);
    const base = {
      email: user.email || '', displayName: user.displayName || '', photoURL: user.photoURL || '',
      provider: (user.providerData[0] && user.providerData[0].providerId) || 'password',
      lastLoginAt: serverTimestamp()
    };
    if(!snap.exists()){ base.createdAt = serverTimestamp(); }
    await setDoc(ref, base, { merge:true });
  }catch(e){ /* non-critical — never block login on this */ }
}

/* ============ AGGREGATIONS ============ */
function nowMonthKey(){ return new Date().toISOString().slice(0,7); }
function lastMonthKey(){ const d=new Date(); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); }
function sumField(arr, f){ return arr.reduce((s,x)=> s+(Number(x[f])||0), 0); }

/* Sum of all payment entries recorded against a given debt id */
function debtPaidAmount(debtId){
  return sumField((S.data.debtPayments||[]).filter(p=>p.debtId===debtId), 'amount');
}
function debtRemaining(d){
  return Math.max(0, (Number(d.totalAmount)||0) - debtPaidAmount(d.id));
}

function aggregates(){
  const inc = S.data.income||[], exp = S.data.expenses||[], fam = S.data.familyPayments||[], deb = S.data.debts||[], rec = S.data.recurringExpenses||[];
  const totalIncome = sumField(inc,'bdtAmount');
  const totalFamily = sumField(fam,'bdtAmount');
  const totalExpense = sumField(exp,'bdtAmount');
  const totalSavings = totalIncome - totalFamily - totalExpense;
  const totalDebt = deb.filter(d=>d.type==='borrowed').reduce((s,d)=> s+debtRemaining(d), 0);
  const remainingBalance = totalSavings - totalDebt;
  const mk = nowMonthKey(), lmk = lastMonthKey();
  const monthInc = inc.filter(x=>monthKey(x.date)===mk);
  const monthExp = exp.filter(x=>monthKey(x.date)===mk);
  const monthFam = fam.filter(x=>monthKey(x.date)===mk);
  const lastMonthExp = exp.filter(x=>monthKey(x.date)===lmk);
  const monthlySavings = sumField(monthInc,'bdtAmount') - sumField(monthExp,'bdtAmount') - sumField(monthFam,'bdtAmount');
  const savingsRate = sumField(monthInc,'bdtAmount')>0 ? (monthlySavings/sumField(monthInc,'bdtAmount')*100) : 0;

  // months present for averages
  const monthSet = new Set([...inc,...exp].map(x=>monthKey(x.date)).filter(Boolean));
  const numMonths = Math.max(monthSet.size,1);
  const avgExpense = totalExpense/numMonths;
  const avgSavings = totalSavings/numMonths;

  // category breakdown
  const catMap = {};
  exp.forEach(x=>{ catMap[x.category]= (catMap[x.category]||0)+(Number(x.bdtAmount)||0); });
  let topCat=null, topCatVal=0;
  Object.entries(catMap).forEach(([k,v])=>{ if(v>topCatVal){ topCat=k; topCatVal=v; } });

  return { totalIncome, totalFamily, totalExpense, totalSavings, totalDebt, remainingBalance,
    monthIncome:sumField(monthInc,'bdtAmount'), monthFamily:sumField(monthFam,'bdtAmount'), monthExpense:sumField(monthExp,'bdtAmount'),
    monthlySavings, savingsRate, avgExpense, avgSavings, catMap, topCat, topCatVal,
    thisMonthExpTotal:sumField(monthExp,'bdtAmount'), lastMonthExpTotal:sumField(lastMonthExp,'bdtAmount') };
}

function monthlySeries(field, colArr){
  // returns {labels:[...12 months...], values:[...]}
  const now = new Date(); const year = now.getFullYear();
  const labels = MONTH_NAMES[S.lang];
  const values = new Array(12).fill(0);
  (colArr||[]).forEach(x=>{
    if(!x.date) return;
    const [y,m] = x.date.split('-');
    if(Number(y)===year){ values[Number(m)-1] += Number(x[field])||0; }
  });
  return { labels, values, year };
}

function optionLabel(f, val){
  if(f.optionLabels && f.optionLabels[val]) return t(f.optionLabels[val]);

}
function currencyOptions(){ return S.profile.currencies && S.profile.currencies.length? S.profile.currencies : DEFAULT_CURRENCIES; }

  if(mod.key==='income'){
    const total = mod.computeTotal(item);

  if(mod.key==='debts'){

  if(mod.key==='recurringExpenses'){

function openForm(modKey, id){
  const mod = MODULES[modKey];
  const existing = id ? (S.data[mod.col]||[]).find(x=>x.id===id) : null;
  const formHtml = `<div class="form-grid" id="formGrid">
    ${mod.fields.map(f=> renderFieldHtml(mod, f, existing)).join('')}
  </div>
  <div id="formErr" class="error-text" style="margin-top:10px;"></div>
  <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:18px;">
    <button class="btn btn-ghost" id="formCancel">${t('cancel')}</button>
    <button class="btn btn-primary" id="formSave"><i class="fa-solid fa-check"></i> ${t('save')}</button>
  </div>`;
  showModal(existing? t('edit') : t('add'), formHtml);
  document.getElementById('formCancel').addEventListener('click', closeModal);

  // live exchangeRate autofill from profile.exchangeRates when currency changes
  const currencySel = document.querySelector('[name="currency"]');
  if(currencySel){
    currencySel.addEventListener('change', ()=>{
      const rateInput = document.querySelector('[name="exchangeRate"]');
      if(rateInput && !rateInput.dataset.touched){
        const r = S.profile.exchangeRates[currencySel.value];
        if(r) rateInput.value = r;
      }
    });
    const rateInput = document.querySelector('[name="exchangeRate"]');
    if(rateInput) rateInput.addEventListener('input', ()=> rateInput.dataset.touched='1');
  }
  document.querySelectorAll('.switch[data-name]').forEach(sw=>{
    sw.addEventListener('click', ()=> sw.classList.toggle('on'));
  });

  document.getElementById('formSave').addEventListener('click', async ()=>{
    const payload = {}; let err = '';
    for(const f of mod.fields){
      if(f.type==='toggle'){
        const sw = document.querySelector(`.switch[data-name="${f.name}"]`);
        payload[f.name] = sw ? sw.classList.contains('on') : !!f.default;
        continue;
      }
      const inputEl = document.querySelector(`[name="${f.name}"]`);
      let val = inputEl ? inputEl.value : (f.default!==undefined? f.default : '');
      if(f.type==='number'){
        if(val===''){ val = f.default!==undefined? f.default : null; }
        else {
          val = Number(val);
          if(isNaN(val)){ err = t('invalidNumber'); break; }
          if(val<0){ err = t('negativeNotAllowed'); break; }
        }
      }
      if(f.required && (val===''||val===null||val===undefined)){ err = t('requiredField'); break; }
      payload[f.name] = val;
    }
    if(err){ document.getElementById('formErr').textContent = err; return; }
    // compute derived
    if(mod.computeTotal){
      const total = mod.computeTotal(payload);
      payload.amount = payload.amount!==undefined ? payload.amount : total;
      const rate = Number(payload.exchangeRate)||1;
      payload.bdtAmount = payload.currency==='BDT' ? total : Math.round(total*rate*100)/100;
    }
    if(payload.date) payload.month = payload.date.slice(0,7);
    const btn = document.getElementById('formSave');
    btn.disabled = true; btn.innerHTML = `<span class="loading-spin"></span>`;
    const ok = await saveDoc(mod.col, existing? existing.id : null, payload);
    if(ok) closeModal();
    else { btn.disabled=false; btn.innerHTML = `<i class="fa-solid fa-check"></i> ${t('save')}`; }
  });
}

function renderFieldHtml(mod, f, existing){
  const val = existing ? existing[f.name] : (f.default!==undefined? f.default : '');
  const label = t(f.labelKey);
  const fullClass = f.full? ' full':'';
  if(f.type==='currency'){
    const opts = currencyOptions();
    return `<div class="field${fullClass}"><label>${label}</label>
      <select name="${f.name}">${opts.map(c=>`<option value="${c}" ${val===c?'selected':''}>${c}</option>`).join('')}</select></div>`;
  }
  if(f.type==='select'){
    const opts = fieldOptions(f);
    return `<div class="field${fullClass}"><label>${label}</label>
      <select name="${f.name}">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${optionLabel(f,o)}</option>`).join('')}</select></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field${fullClass}"><label>${label}</label><textarea name="${f.name}">${escapeHtml(val)}</textarea></div>`;
  }
  if(f.type==='toggle'){
    return `<div class="field${fullClass}"><label>${label}</label>
      <div class="switch ${val?'on':''}" data-name="${f.name}"></div></div>`;
  }
  const inputType = f.type==='date'?'date':f.type==='number'?'number':'text';
  return `<div class="field${fullClass}"><label>${label}</label>
    <input type="${inputType}" name="${f.name}" value="${escapeHtml(val)}" ${f.placeholder?`placeholder="${f.placeholder}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} ${f.type==='number'?'step="any"':''}></div>`;
}

      <h3 style="margin-top:0; font-size:15px;">${t('upcoming')}</h3>
      <div id="upcomingArea"></div>
    </div>
  </div>
  `;

  // insights
  const insightsArea = box.querySelector('#insightsArea');
  const insights = [];
  if(A.lastMonthExpTotal>0){
    const diff = ((A.thisMonthExpTotal-A.lastMonthExpTotal)/A.lastMonthExpTotal*100);
    if(S.lang==='bn') insights.push(`এই মাসে আপনার খরচ গত মাসের তুলনায় ${diff>=0?'':''}${fmt(Math.abs(diff))}% ${diff>=0?'বেশি':'কম'}।`);
    else insights.push(`Your spending this month is ${fmt(Math.abs(diff))}% ${diff>=0?'higher':'lower'} than last month.`);
  }
  if(A.monthIncome>0){
    if(S.lang==='bn') insights.push(`এই মাসে আপনি আয়ের ${fmt(Math.max(0,A.savingsRate))}% সঞ্চয় করেছেন।`);
    else insights.push(`You saved ${fmt(Math.max(0,A.savingsRate))}% of your income this month.`);
  }
  if(A.topCat){
    if(S.lang==='bn') insights.push(`আপনার সবচেয়ে বেশি খরচ হয়েছে ${A.topCat} ক্যাটাগরিতে।`);
    else insights.push(`Your highest spending category is ${A.topCat}.`);
  }
  if(mainGoal && A.monthlySavings>0){
    const remain = (Number(mainGoal.targetAmount)||0)-(Number(mainGoal.currentAmount)||0);
    const monthsLeft = Math.max(1, Math.ceil(remain/A.monthlySavings));
    if(S.lang==='bn') insights.push(`আপনার বর্তমান সঞ্চয়ের হার অনুযায়ী "${mainGoal.goalName}" লক্ষ্য পূরণ হতে আনুমানিক ${monthsLeft} মাস লাগতে পারে।`);
    else insights.push(`At your current savings rate, reaching "${mainGoal.goalName}" may take about ${monthsLeft} months.`);
  }
  if(!insights.length){ insightsArea.innerHTML = `<div class="empty card"><i class="fa-solid fa-lightbulb"></i><div>${t('noData')}</div></div>`; }
  else insightsArea.innerHTML = insights.map(i=>`<div class="insight"><i class="fa-solid fa-lightbulb"></i><span>${i}</span></div>`).join('');

  // recent tx
  const allTx = [
    ...(S.data.income||[]).map(x=>({...x,__type:'income'})),
    ...(S.data.expenses||[]).map(x=>({...x,__type:'expense'})),
    ...(S.data.familyPayments||[]).map(x=>({...x,__type:'family'}))
  ].sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,6);
  const recentArea = box.querySelector('#recentTxArea');
  if(!allTx.length){ recentArea.innerHTML = `<div class="empty"><i class="fa-solid fa-inbox"></i><div>${t('noData')}</div></div>`; }
  else recentArea.innerHTML = allTx.map(x=>`<div style="display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
    <span style="min-width:0;"><span class="pill pill-${x.__type}">${x.__type==='income'?t('income'):x.__type==='expense'?t('expense'):t('family')}</span> ${escapeHtml(x.description||x.receiverName||x.note||'')}</span>
    <span class="mono" style="flex-shrink:0;">${money(x.bdtAmount||0)}</span>
  </div>`).join('');

  // upcoming payments
  const rec = (S.data.recurringExpenses||[]).filter(r=>r.active);
  const upArea = box.querySelector('#upcomingArea');
  if(!rec.length){ upArea.innerHTML = `<div class="empty"><i class="fa-solid fa-calendar-check"></i><div>${t('noData')}</div></div>`; }
  else upArea.innerHTML = rec.map(r=>`<div style="display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
    <span style="min-width:0;">${escapeHtml(r.name)} <span class="small-muted">(${t(r.frequency||'monthly')})</span></span>
    <span class="mono" style="flex-shrink:0;">${money(r.amount||0)} ${escapeHtml(r.currency||'')}</span>
  </div>`).join('');

  buildDashboardCharts(A);
  return box;
}

}

function statCard(icon,color,label,value,sub){
  return `<div class="card stat-card">
    <div class="stat-icon" style="background:var(--${color}-tint); color:var(--${color==='primary'?'primary':color==='gold'?'gold':'rust'});"><i class="fa-solid ${icon}"></i></div>

function destroyCharts(){ Object.values(S.charts).forEach(c=>{ try{c.destroy();}catch(e){} }); S.charts={}; }

function chartColors(){
  const css = getComputedStyle(document.documentElement);
  return {
    primary: css.getPropertyValue('--primary').trim(),
    gold: css.getPropertyValue('--gold').trim(),
    rust: css.getPropertyValue('--rust').trim(),
    ink: css.getPropertyValue('--ink').trim(),
    border: css.getPropertyValue('--border').trim()
  };
}

async function buildDashboardCharts(A){
  const ok = await loadChartJs();
  // The route may have changed (or the app re-rendered) while we were waiting for the
  // library to download — bail out quietly instead of drawing into stale/removed canvases.
  if(S.route!=='dashboard') return;
  const wrapIds = ['chartWrapIE','chartWrapCat','chartWrapSav','chartWrapFam'];
  if(!ok || !window.Chart){
    wrapIds.forEach(id=>{
      const wrap = document.getElementById(id);
      if(wrap && wrap.querySelector('canvas')){
        wrap.innerHTML = `<div class="chart-empty"><i class="fa-solid fa-wifi"></i><span>${t('chartLoadFailed')}</span>
          <button class="btn btn-ghost btn-sm" id="retryChart_${id}" style="margin-top:6px;">
            <i class="fa-solid fa-rotate-right"></i> ${S.lang==='bn'?'আবার চেষ্টা করুন':'Retry'}
          </button></div>`;
        const btn = document.getElementById('retryChart_'+id);
        if(btn) btn.addEventListener('click', ()=>{ window.__chartJsPromise=null; render(); });
      }
    });
    return;
  }
  destroyCharts();
  const C = chartColors();
  Chart.defaults.color = C.ink; Chart.defaults.borderColor = C.border; Chart.defaults.font.family = "Inter";

  const incSeries = monthlySeries('bdtAmount', S.data.income);
  const expSeries = monthlySeries('bdtAmount', S.data.expenses);
  const famSeries = monthlySeries('bdtAmount', S.data.familyPayments);

  const c1 = document.getElementById('chartIncomeExpense');
  if(c1) S.charts.c1 = new Chart(c1, { type:'bar', data:{ labels: incSeries.labels, datasets:[
    {label:t('income'), data:incSeries.values, backgroundColor:C.primary, borderRadius:6},
    {label:t('expense'), data:expSeries.values, backgroundColor:C.rust, borderRadius:6}
  ]}, options:{ responsive:true, plugins:{legend:{position:'bottom'}} } });

  const catLabels = Object.keys(A.catMap);
  const catValues = Object.values(A.catMap);
  const c2 = document.getElementById('chartCategory');
  if(c2) S.charts.c2 = new Chart(c2, { type:'doughnut', data:{ labels: catLabels, datasets:[{ data:catValues, backgroundColor:[C.primary,C.gold,C.rust,'#6C8EBF','#9673A6','#82B366','#D6B656','#B85450','#8CA6C1','#D79B00','#60A16A'] }] }, options:{responsive:true, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}}}}} });

  // savings growth cumulative by month across all recorded months (sorted)
  const allMonths = Array.from(new Set([...(S.data.income||[]), ...(S.data.expenses||[]), ...(S.data.familyPayments||[])].map(x=>monthKey(x.date)).filter(Boolean))).sort();
  let running = 0;
  const growthVals = allMonths.map(mk=>{
    const inc = sumField((S.data.income||[]).filter(x=>monthKey(x.date)===mk),'bdtAmount');
    const exp = sumField((S.data.expenses||[]).filter(x=>monthKey(x.date)===mk),'bdtAmount');
    const fam = sumField((S.data.familyPayments||[]).filter(x=>monthKey(x.date)===mk),'bdtAmount');
    running += (inc-exp-fam);
    return running;
  });
  const c3 = document.getElementById('chartSavingsGrowth');
  if(c3) S.charts.c3 = new Chart(c3, { type:'line', data:{ labels: allMonths, datasets:[{ label:t('savings'), data:growthVals, borderColor:C.primary, backgroundColor:C.primary+'33', fill:true, tension:.35 }] }, options:{responsive:true, plugins:{legend:{display:false}}} });

  const c4 = document.getElementById('chartFamily');
  if(c4) S.charts.c4 = new Chart(c4, { type:'bar', data:{ labels: famSeries.labels, datasets:[{ label:t('family'), data:famSeries.values, backgroundColor:C.gold, borderRadius:6 }] }, options:{responsive:true, plugins:{legend:{display:false}}} });
}

/* ============ DEBTS VIEW (loan ledger: per-person balance + payment history) ============ */
function openDebtForm(id){
  const existing = id ? (S.data.debts||[]).find(x=>x.id===id) : null;
  const formHtml = `<div class="form-grid">
    <div class="field"><label>${t('person')}</label><input type="text" name="person" value="${escapeHtml(existing?existing.person:'')}"></div>
    <div class="field"><label>${t('type')}</label>
      <select name="type">
        <option value="borrowed" ${existing&&existing.type==='borrowed'?'selected':''}>${t('borrowed')}</option>
        <option value="lent" ${existing&&existing.type==='lent'?'selected':''}>${t('lent')}</option>
      </select>
    </div>
    <div class="field"><label>${t('initialAmount')}</label><input type="number" step="any" min="0" name="totalAmount" value="${existing?existing.totalAmount:''}"></div>
    <div class="field"><label>${t('date')}</label><input type="date" name="date" value="${existing?existing.date:''}"></div>
    <div class="field"><label>${t('dueDate')}</label><input type="date" name="dueDate" value="${existing&&existing.dueDate?existing.dueDate:''}"></div>
    <div class="field full"><label>${t('note')}</label><textarea name="note">${escapeHtml(existing&&existing.note?existing.note:'')}</textarea></div>
  </div>
  <div id="formErr" class="error-text" style="margin-top:10px;"></div>
  <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:18px;">
    <button class="btn btn-ghost" id="formCancel">${t('cancel')}</button>
    <button class="btn btn-primary" id="formSave"><i class="fa-solid fa-check"></i> ${t('save')}</button>
  </div>`;
  showModal(existing? t('edit') : t('newLoan'), formHtml);
  document.getElementById('formCancel').addEventListener('click', closeModal);
  document.getElementById('formSave').addEventListener('click', async ()=>{
    const person = document.querySelector('[name="person"]').value.trim();
    const type = document.querySelector('[name="type"]').value;
    const totalAmountRaw = document.querySelector('[name="totalAmount"]').value;
    const date = document.querySelector('[name="date"]').value;
    const dueDate = document.querySelector('[name="dueDate"]').value;
    const note = document.querySelector('[name="note"]').value.trim();
    const errEl = document.getElementById('formErr');
    if(!person || !date || totalAmountRaw===''){ errEl.textContent = t('requiredField'); return; }
    const totalAmount = Number(totalAmountRaw);
    if(isNaN(totalAmount)){ errEl.textContent = t('invalidNumber'); return; }
    if(totalAmount<0){ errEl.textContent = t('negativeNotAllowed'); return; }
    const payload = { person, type, totalAmount, date, dueDate: dueDate||null, note, month: date.slice(0,7) };
    const btn = document.getElementById('formSave');
    btn.disabled = true; btn.innerHTML = `<span class="loading-spin"></span>`;
    const ok = await saveDoc('debts', existing? existing.id : null, payload);
    if(ok) closeModal();
    else { btn.disabled=false; btn.innerHTML = `<i class="fa-solid fa-check"></i> ${t('save')}`; }
  });
}

function openPaymentHistory(debt){
  const payments = (S.data.debtPayments||[]).filter(p=>p.debtId===debt.id).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const paid = debtPaidAmount(debt.id);
  const remaining = debtRemaining(debt);
  const bodyHtml = `
    <div class="debt-amounts" style="margin-bottom:14px;">
      <div class="da"><div class="da-label">${t('totalAmount')}</div><div class="da-value">${money(debt.totalAmount||0)}</div></div>
      <div class="da"><div class="da-label">${t('paidAmount')}</div><div class="da-value">${money(paid)}</div></div>
      <div class="da"><div class="da-label">${t('remainingAmount')}</div><div class="da-value">${money(remaining)}</div></div>
    </div>
    <div id="paymentListArea"></div>
  `;
  const modal = showModal(`${t('paymentHistory')} — ${escapeHtml(debt.person)}`, bodyHtml);
  const listArea = modal.querySelector('#paymentListArea');
  if(!payments.length){
    listArea.innerHTML = `<div class="empty"><i class="fa-solid fa-receipt"></i><div>${t('noPayments')}</div></div>`;

    </div>`).join('');
    listArea.querySelectorAll('[data-del-pay]').forEach(b=>{
      b.addEventListener('click', ()=> confirmDelete(async ()=>{ await removeDoc('debtPayments', b.getAttribute('data-del-pay')); openPaymentHistory(debt); }));

function renderDebtsView(){
  const box = document.createElement('div');
  const arr = S.data.debts||[];
  const borrowed = arr.filter(d=>d.type==='borrowed');
  const lent = arr.filter(d=>d.type==='lent');
  const totalOwedByMe = borrowed.reduce((s,d)=> s+debtRemaining(d), 0);
  const totalOwedToMe = lent.reduce((s,d)=> s+debtRemaining(d), 0);

  box.innerHTML = `
  <div class="grid cards-2" style="margin-bottom:8px;">
    ${statCard('fa-hand-holding-dollar','rust', t('totalDebt'), money(totalOwedByMe), t('borrowedFrom'))}
    ${statCard('fa-sack-dollar','primary', t('remainingBalance')+' ('+t('lent')+')', money(totalOwedToMe), t('lentTo'))}
  </div>
  <div class="section-title"><h3>${t('debts')} <span class="small-muted">(${arr.length})</span></h3>
    <button class="btn btn-primary btn-sm" id="addDebtBtn"><i class="fa-solid fa-plus"></i> ${t('newLoan')}</button>
  </div>
  <div class="grid cards-2" id="debtsGrid"></div>
  `;
  box.querySelector('#addDebtBtn').addEventListener('click', ()=> openDebtForm(null));
  const grid = box.querySelector('#debtsGrid');
  if(!arr.length){ grid.innerHTML = `<div class="empty card" style="grid-column:1/-1;"><i class="fa-solid fa-hand-holding-dollar"></i><div>${t('noData')}</div></div>`; return box; }

  arr.forEach(d=>{
    const paid = debtPaidAmount(d.id);
    const remaining = debtRemaining(d);
    const isPaid = remaining<=0 && (Number(d.totalAmount)||0)>0;
    const card = el(`<div class="card debt-card">
      <div class="debt-head">
        <div>
          <h3 style="margin:0; font-size:16px;">${escapeHtml(d.person)}</h3>
          <span class="pill ${d.type==='borrowed'?'pill-expense':'pill-income'}" style="margin-top:6px; display:inline-flex;">${d.type==='borrowed'?t('borrowed'):t('lent')}</span>
          ${isPaid?`<span class="pill pill-paid" style="margin-top:6px;">${t('fullyPaid')}</span>`:''}
        </div>
        <div class="row-actions">
          <button class="icon-btn btn-sm" data-edit="${d.id}"><i class="fa-solid fa-pen"></i></button>
          <button class="icon-btn btn-sm" data-del="${d.id}"><i class="fa-solid fa-trash" style="color:var(--rust);"></i></button>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, d.totalAmount? Math.round(paid/d.totalAmount*100):0)}%;"></div></div>
      <div class="debt-amounts">
        <div class="da"><div class="da-label">${t('totalAmount')}</div><div class="da-value">${money(d.totalAmount||0)}</div></div>
        <div class="da"><div class="da-label">${t('paidAmount')}</div><div class="da-value">${money(paid)}</div></div>
        <div class="da"><div class="da-label">${t('remainingAmount')}</div><div class="da-value" style="color:${remaining>0?'var(--rust)':'var(--primary)'}">${money(remaining)}</div></div>
      </div>
      ${d.dueDate?`<div class="small-muted">${t('dueDate')}: ${d.dueDate}</div>`:''}
      ${d.note?`<div class="small-muted">${escapeHtml(d.note)}</div>`:''}
      <div class="debt-actions">
        <button class="btn btn-ghost btn-sm" data-history="${d.id}"><i class="fa-solid fa-clock-rotate-left"></i> ${t('viewPayments')}</button>
        ${!isPaid?`<button class="btn btn-primary btn-sm" data-pay="${d.id}"><i class="fa-solid fa-plus"></i> ${t('addPayment')}</button>`:''}
      </div>
    </div>`);
    card.querySelector('[data-edit]').addEventListener('click', ()=> openDebtForm(d.id));
    card.querySelector('[data-del]').addEventListener('click', ()=> confirmDelete(async ()=>{
      // Clean up this debt's payment history too so it doesn't linger orphaned.
      const pays = (S.data.debtPayments||[]).filter(p=>p.debtId===d.id);
      for(const p of pays){ await removeDoc('debtPayments', p.id); }
      await removeDoc('debts', d.id);
    }));
    card.querySelector('[data-history]').addEventListener('click', ()=> openPaymentHistory(d));
    const payBtn = card.querySelector('[data-pay]');
    if(payBtn) payBtn.addEventListener('click', ()=> openPaymentForm(d));
    grid.appendChild(card);
  });
  return box;
}

function exportCsv(rows, filename){
  if(!rows.length){ toast(t('noData'),'err'); return; }
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(',')].concat(rows.map(r=> headers.map(h=> `"${String(r[h]==null?'':r[h]).replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('invalid-image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read-error'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('invalid-image'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const max = maxSize || 320;
        if(w>h){ if(w>max){ h = Math.round(h*max/w); w = max; } }
        else { if(h>max){ w = Math.round(w*max/h); h = max; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', 0.85)); }
        catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    await saveDoc('expenses', null, { date:today, category:'খাবার', description:'Sample grocery', amount:150, currency:'SAR', exchangeRate:32, bdtAmount:4800, paymentMethod:'নগদ', month:thisMonth, isSample:true });
    await saveDoc('familyPayments', null, { date:today, receiverName:'Sample', relationship:'বাবা-মা', amount:800, currency:'SAR', exchangeRate:32, bdtAmount:25600, purpose:'Monthly support', month:thisMonth, isSample:true });
    await saveDoc('goals', null, { goalName: S.lang==='bn'?'বাড়ি করার জন্য':'Build a house', targetAmount:1000000, currentAmount:150000, deadline:'2028-01-01', description:'Sample goal', isSample:true });
    toast(S.lang==='bn'?'স্যাম্পল ডেটা যোগ হয়েছে':'Sample data added','ok');
  });
  box.querySelector('#delSampleBtn').addEventListener('click', ()=>{
    confirmDelete(async ()=>{
      for(const mod of Object.values(MODULES)){
        const arr = (S.data[mod.col]||[]).filter(x=>x.isSample);
        for(const item of arr){ await removeDoc(mod.col, item.id); }
      }
    });
  });
  return box;
}

  box.appendChild(renderModuleView('familyPayments'));
  return box;
}

/* ============ ROUTER ============ */
/* ============ ADMIN DASHBOARD ============ */
async function fetchAllUsersDirectory(){
  const snap = await getDocs(collection(db, 'users'));
  const list = [];
  snap.forEach(d=> list.push({ id:d.id, ...d.data() }));
  list.sort((a,b)=>{
    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
    return tb-ta;
  });
  return list;
}
async function fetchUserAggregate(uid){
  const out = {};
  for(const mod of Object.values(MODULES)){
    try{
      const snap = await getDocs(collection(db, 'users', uid, mod.col));
      const arr = [];
      snap.forEach(d=>{ const it = { id:d.id, ...d.data() }; if(!it.isDeleted) arr.push(it); });
      out[mod.col] = arr;
    }catch(e){ out[mod.col] = []; }
  }
  const totalIncome = sumField(out.income||[], 'bdtAmount');
  const totalFamily = sumField(out.familyPayments||[], 'bdtAmount');
  const totalExpense = sumField(out.expenses||[], 'bdtAmount');
  const totalSavings = totalIncome - totalFamily - totalExpense;
  const totalDebt = (out.debts||[]).filter(d=>d.type==='borrowed').reduce((s,d)=>{
    const paid = sumField((out.debtPayments||[]).filter(p=>p.debtId===d.id), 'amount');
    return s + Math.max(0, (Number(d.totalAmount)||0) - paid);
  },0);
  return { raw: out, totalIncome, totalFamily, totalExpense, totalSavings, totalDebt,
    counts:{ income:(out.income||[]).length, expenses:(out.expenses||[]).length, familyPayments:(out.familyPayments||[]).length, goals:(out.goals||[]).length, debts:(out.debts||[]).length, recurringExpenses:(out.recurringExpenses||[]).length } };
}
async function deleteAllUserData(uid){
  for(const mod of Object.values(MODULES)){
    try{
      const snap = await getDocs(collection(db, 'users', uid, mod.col));
      for(const d of snap.docs){ await deleteDoc(d.ref); }
    }catch(e){}
  }
}

function renderAdminView(){
  const box = document.createElement('div');
  const state = renderAdminView._state || { view:'list', users:null, loading:true, search:'', selected:null, selectedAgg:null, selectedLoading:false };
  renderAdminView._state = state;

  box.innerHTML = `<div class="insight" style="background:var(--gold-tint);"><i class="fa-solid fa-shield-halved"></i><span>${t('adminNote')}</span></div><div id="adminBody"></div>`;
  const bodyEl = box.querySelector('#adminBody');

  async function loadUsers(){
    state.loading = true; paint();
    try{ state.users = await fetchAllUsersDirectory(); }
    catch(e){ toast(friendlyError(e),'err'); state.users = []; }
    state.loading = false; paint();
  }

  async function openUser(u){
    state.view='detail'; state.selected = u; state.selectedAgg = null; state.selectedLoading = true; paint();
    try{ state.selectedAgg = await fetchUserAggregate(u.id); }
    catch(e){ toast(friendlyError(e),'err'); }
    state.selectedLoading = false; paint();
  }

  function paint(){
    if(state.view==='detail' && state.selected){
      const u = state.selected;
      bodyEl.innerHTML = `
        <div class="section-title"><h3>${escapeHtml(u.email||u.id)}</h3>
          <button class="btn btn-ghost btn-sm" id="backList"><i class="fa-solid fa-arrow-left"></i> ${t('backToUserList')}</button>
        </div>
        <div id="userDetailArea"></div>
      `;
      bodyEl.querySelector('#backList').addEventListener('click', ()=>{ state.view='list'; paint(); });
      const area = bodyEl.querySelector('#userDetailArea');
      if(state.selectedLoading){ area.innerHTML = `<div class="empty card"><i class="fa-solid fa-spinner fa-spin"></i><div>${t('loadingUsers')}</div></div>`; return; }
      const A = state.selectedAgg;
      if(!A){ area.innerHTML = `<div class="empty card"><i class="fa-solid fa-triangle-exclamation"></i><div>${t('genericError')}</div></div>`; return; }
      area.innerHTML = `
        <div class="grid cards-4">
          ${statCard('fa-sack-dollar','primary', t('totalIncome'), money(A.totalIncome))}
          ${statCard('fa-house-chimney-user','gold', t('familySupport'), money(A.totalFamily))}
          ${statCard('fa-cart-shopping','rust', t('totalExpense'), money(A.totalExpense))}
          ${statCard('fa-piggy-bank','primary', t('totalSavings'), money(A.totalSavings))}
        </div>
        <div class="card" style="margin-top:16px;">
          <h3 style="margin-top:0; font-size:15px;">${t('userSummary')}</h3>
          <div class="small-muted">UID: <span class="mono" style="word-break:break-all;">${u.id}</span></div>
          <div class="small-muted">${t('provider')}: ${escapeHtml(u.provider||'')}</div>
          <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:13px;">
            <span>${t('income')}: <strong>${A.counts.income}</strong></span>
            <span>${t('expense')}: <strong>${A.counts.expenses}</strong></span>
            <span>${t('family')}: <strong>${A.counts.familyPayments}</strong></span>
            <span>${t('goals')}: <strong>${A.counts.goals}</strong></span>
            <span>${t('debts')}: <strong>${A.counts.debts}</strong></span>
            <span>${t('recurring')}: <strong>${A.counts.recurringExpenses}</strong></span>
          </div>
        </div>
        <div class="card" style="margin-top:16px;">
          <h3 style="margin-top:0; font-size:15px; color:var(--rust);">${t('deleteUserData')}</h3>
          <p class="small-muted">${t('deleteUserDataWarn')}</p>
          <button class="btn btn-danger btn-sm" id="delUserDataBtn"><i class="fa-solid fa-trash"></i> ${t('deleteUserData')}</button>
        </div>
      `;
      area.querySelector('#delUserDataBtn').addEventListener('click', ()=>{
        confirmDelete(async ()=>{ await deleteAllUserData(u.id); toast(t('deletedItem'),'ok'); openUser(u); });
      });
      return;
    }

    // list view
    const searchVal = state.search.toLowerCase();
    const users = (state.users||[]).filter(u=> !searchVal || (u.email||'').toLowerCase().includes(searchVal));
    bodyEl.innerHTML = `
      <div class="section-title"><h3>${t('totalUsers')}: ${state.users? state.users.length : '—'}</h3>
        <button class="btn btn-ghost btn-sm" id="refreshUsers"><i class="fa-solid fa-rotate"></i> ${t('refresh')}</button>
      </div>
      <div class="filters"><input type="text" id="userSearch" placeholder="${t('searchUsers')}" value="${escapeHtml(state.search)}"></div>
      <div id="userListArea"></div>
    `;
    bodyEl.querySelector('#refreshUsers').addEventListener('click', loadUsers);
    bodyEl.querySelector('#userSearch').addEventListener('input', (e)=>{ state.search = e.target.value; paint(); });
    const listArea = bodyEl.querySelector('#userListArea');
    if(state.loading){ listArea.innerHTML = `<div class="empty card"><i class="fa-solid fa-spinner fa-spin"></i><div>${t('loadingUsers')}</div></div>`; return; }
    if(!users.length){ listArea.innerHTML = `<div class="empty card"><i class="fa-solid fa-users"></i><div>${t('noUsersYet')}</div></div>`; return; }
    listArea.innerHTML = `<div class="table-wrap"><table><thead><tr>
      <th>${t('email')}</th><th>${t('provider')}</th><th>${t('joined')}</th><th>${t('lastLogin')}</th><th></th>
    </tr></thead><tbody>${users.map(u=>{
      const created = u.createdAt && u.createdAt.toDate ? u.createdAt.toDate().toISOString().slice(0,10) : '—';
      const last = u.lastLoginAt && u.lastLoginAt.toDate ? u.lastLoginAt.toDate().toISOString().slice(0,10) : '—';
      return `<tr>
        <td>${escapeHtml(u.email||u.id)}</td><td>${escapeHtml((u.provider||'').replace('.com',''))}</td><td>${created}</td><td>${last}</td>
        <td><button class="btn btn-ghost btn-sm" data-open-user="${u.id}">${t('viewDetails')}</button></td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
    listArea.querySelectorAll('[data-open-user]').forEach(b=> b.addEventListener('click', ()=>{
      const u = state.users.find(x=>x.id===b.getAttribute('data-open-user'));
      if(u) openUser(u);
    }));
  }

  if(state.users===null) loadUsers(); else paint();
  return box;
}

function renderRoute(){
  destroyCharts();
  switch(S.route){
    case 'dashboard': return renderDashboard();
    case 'income': return renderModuleView('income');
    case 'expenses': return renderModuleView('expenses');
    case 'familyPayments': return renderFamilyView();
    case 'goals': return renderGoalsView();
    case 'debts': return renderDebtsView();
    case 'recurringExpenses': return renderModuleView('recurringExpenses');
    case 'transactions': return renderTransactionsView();
    case 'reports': return renderReportsView();
    case 'settings': return renderSettingsView();
    case 'admin': return S.isAdmin ? renderAdminView() : renderDashboard();
    default: return renderDashboard();
  }
}

window.addEventListener('online', ()=> toast(S.lang==='bn'?'ইন্টারনেট সংযোগ ফিরে এসেছে':'Back online','ok'));
window.addEventListener('offline', ()=> toast(t('networkError'),'err'));

render();
</script>
