<!doctype html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>রেটবন্ধু</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#fff;--soft:#f2f6ff;--ink:#0f1b3d;--mute:#5b6786;--pri:#1d4ed8;--line:#dbe4f7;--err:#b42318;--ok:#067647}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--soft:#121c33;--ink:#e8eefc;--mute:#9fb0d3;--pri:#6b94ff;--line:#22304f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{font-size:20px;color:var(--pri)}main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{min-height:1.4em;margin-top:8px}.err{color:var(--err)}.ok{color:var(--ok)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--pri);color:#fff;font-size:13px}
.big{font-size:28px;font-weight:700;letter-spacing:.5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
[hidden]{display:none!important}
</style></head><body>
<header><b>রেটবন্ধু</b><button id="out" class="ghost" hidden>লগআউট</button></header>
<main>
<section id="guest">
 <div class="card"><h2 id="t">লগইন</h2>
  <label for="em">ইমেইল</label><input id="em" type="email" autocomplete="email">
  <label for="pw">পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row"><button id="go">লগইন করুন</button><button id="sw" class="ghost">নতুন অ্যাকাউন্ট খুলুন</button><button id="fg" class="ghost">পাসওয়ার্ড ভুলে গেছেন?</button></div>
  <div id="m1" class="msg" role="status"></div></div>
</section>
<section id="dash" hidden>
 <div class="card"><div>আপনার রেটবন্ধু আইডি</div><div class="big" id="rb">তৈরি হচ্ছে…</div>
  <small>এই আইডি স্থায়ী, বদলানো যায় না।</small></div>
 <div class="grid">
  <div class="card"><div>প্ল্যান</div><span class="badge" id="plan">Free</span></div>
  <div class="card"><div>মেয়াদ</div><b id="exp">—</b></div></div>
 <div class="card"><label for="dn">আপনার নাম</label><input id="dn" maxlength="60">
  <div class="row"><button id="sv">সেভ করুন</button></div><div id="m2" class="msg" role="status"></div></div>
 <div class="card">কারেন্সি রেট, ওয়ালেট ও পেমেন্ট পরের ধাপে যোগ হবে।</div>
</section></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {doc,onSnapshot,updateDoc,runTransaction} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// TODO: Firebase Console → Project settings → Your apps থেকে সঠিক appId বসান।
const firebaseConfig = {
  apiKey: "AIzaSyAxmmXGlmCHrSEvNstpgLxguCy8Xq3xMvE",
  authDomain: "e-wallet-95fb2.firebaseapp.com",
  databaseURL: "https://e-wallet-95fb2-default-rtdb.firebaseio.com",
  projectId: "e-wallet-95fb2",
  storageBucket: "e-wallet-95fb2.firebasestorage.app",
  messagingSenderId: "274036792120",
  appId: "1:881fbe414e648ee43fcd", // ⚠ অসম্পূর্ণ — মূল প্রজেক্ট থেকে নিন
  measurementId: "G-7ZK36WX89V"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $=i=>document.getElementById(i);let reg=false,unsub=null;
const say=(el,t,ok)=>{el.textContent=t;el.className="msg "+(ok?"ok":"err")};
const E={"auth/invalid-credential":"ইমেইল বা পাসওয়ার্ড ভুল।","auth/email-already-in-use":"এই ইমেইল দিয়ে অ্যাকাউন্ট আছে।","auth/weak-password":"পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের দিন।","auth/invalid-email":"ইমেইল সঠিক নয়।","auth/too-many-requests":"অনেকবার চেষ্টা হয়েছে, একটু পরে আবার দিন।"};
$("sw").onclick=()=>{reg=!reg;$("t").textContent=reg?"নতুন অ্যাকাউন্ট":"লগইন";$("go").textContent=reg?"অ্যাকাউন্ট খুলুন":"লগইন করুন";$("sw").textContent=reg?"আগে থেকেই অ্যাকাউন্ট আছে":"নতুন অ্যাকাউন্ট খুলুন"};
$("go").onclick=async()=>{const e=$("em").value.trim(),p=$("pw").value;if(!e||p.length<8)return say($("m1"),"ইমেইল ও কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।");
 try{await(reg?createUserWithEmailAndPassword:signInWithEmailAndPassword)(auth,e,p)}catch(x){say($("m1"),E[x.code]||"সমস্যা হয়েছে, আবার চেষ্টা করুন।")}};
$("fg").onclick=async()=>{const e=$("em").value.trim();if(!e)return say($("m1"),"আগে ইমেইল লিখুন।");
 try{await sendPasswordResetEmail(auth,e)}catch{}say($("m1"),"ইমেইলটি নিবন্ধিত হলে রিসেট লিংক পাঠানো হয়েছে।",1)};
$("out").onclick=()=>signOut(auth);
$("sv").onclick=async()=>{try{await updateDoc(doc(db,"users",auth.currentUser.uid),{displayName:$("dn").value.trim().slice(0,60)});say($("m2"),"সেভ হয়েছে।",1)}catch(x){say($("m2"),"সেভ করা যায়নি: "+(x.code||x.message))}};
let busy=false;
async function ensureRb(u){if(busy)return;busy=true;
 try{await runTransaction(db,async tx=>{
  const cr=doc(db,"counters","rb"),ur=doc(db,"users",u.uid);
  const c=await tx.get(cr),us=await tx.get(ur);
  if(us.exists()&&us.data().rbId)return;
  const n=(c.exists()?c.data().n:100000)+1,id="RB-"+n;
  tx.set(cr,{n});tx.set(doc(db,"rbIds",id),{uid:u.uid});
  if(us.exists())tx.update(ur,{rbId:id});else tx.set(ur,{rbId:id,email:u.email||null,displayName:"",lang:"bn"});
 })}catch(x){say($("m2"),"আইডি তৈরি ব্যর্থ: "+(x.code||x.message))}busy=false}
onAuthStateChanged(auth,u=>{unsub&&unsub();$("guest").hidden=!!u;$("dash").hidden=!u;$("out").hidden=!u;if(!u)return;
 unsub=onSnapshot(doc(db,"users",u.uid),s=>{const d=s.data();if(!d||!d.rbId){ensureRb(u);if(!d)return}$("rb").textContent=d.rbId||"তৈরি হচ্ছে…";
  $("plan").textContent=d.subscription?.plan==="free"||!d.subscription?"Free":"Premium";
  const x=d.subscription?.expiresAt;$("exp").textContent=x?x.toDate().toLocaleDateString("bn-BD"):"—";
  if(document.activeElement!==$("dn"))$("dn").value=d.displayName||""})});
</script></body></html>
